<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F3EC" />
    <meta name="color-scheme" content="light dark" />

    <!-- Neutral title: this may be visible to the abuser on a shared device. -->
    <title>Kawach</title>
    <meta name="description" content="Digital safety response kit." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />

    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kawach" />

    <!--
      Apply the saved theme before first paint. An explicit choice wins;
      otherwise follow the OS. Runs synchronously so the page never flashes
      the wrong theme.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kawach.theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#131619' : '#F5F3EC');
        } catch (e) {
          /* storage blocked — fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
